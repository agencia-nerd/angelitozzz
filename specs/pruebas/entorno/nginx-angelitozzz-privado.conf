#
# Angelitozzz Cursos: los PDF de materiales solo se entregan por /cursos/descargar/<id>/ (con permiso).
# En Local: pegarlo en "~/Local Sites/angelitozzz/conf/nginx/site.conf.hbs", dentro del bloque server, y
# reiniciar el sitio. Comprobar que http://angelitozzz.local/wp-content/uploads/angelitozzz-privado/ da 403.
# En producción hay que replicar esta regla (o su equivalente en Apache) antes de subir materiales (F7).
#
location ^~ /wp-content/uploads/angelitozzz-privado/ {
    deny all;
}
