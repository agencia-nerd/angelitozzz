; PHP de línea de comandos para composer y PHPUnit del plugin angelitozzz-cursos (y para datos-f5.php).
; Usa el PHP 8.4 de Local. No es el php.ini del sitio.
;
; Copiarlo a "~/Local Sites/angelitozzz/wp-tests/php-cli.ini" y cambiar <USUARIO> y la versión de PHP
; por las de la PC (Local → el sitio → PHP; la carpeta está en %APPDATA%\Local\lightning-services\).
extension_dir = "C:/Users/<USUARIO>/AppData/Roaming/Local/lightning-services/php-8.4.27+0/bin/win64/ext"
extension=openssl
extension=curl
extension=mbstring
extension=mysqli
extension=zip
extension=fileinfo
extension=sodium
extension=gd
extension=intl
memory_limit = 1G
date.timezone = America/Lima
